<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin da Vaquinha</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  main{max-width:520px;padding-top:40px}
  label{display:block;font-weight:600;margin-top:14px}
  .row{display:flex;gap:8px}.row .input{flex:1}
  #list li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  #list{list-style:none;padding:0}
  .x{background:none;border:0;color:var(--red);font-size:1.2rem;cursor:pointer}
</style>
</head>
<body>
<header class="topbar"><div class="brand">🇬🇧 Admin · Bella → London</div></header>
<main>
  <section class="card" id="loginBox">
    <h2>Entrar</h2>
    <label>E-mail <input id="email" class="input" type="email"></label>
    <label>Senha <input id="pass" class="input" type="password"></label>
    <button id="login" class="btn btn-navy btn-block">Entrar</button>
    <p id="msg" class="note"></p>
  </section>

  <section class="card" id="panel" hidden>
    <h2>Atualizar vaquinha</h2>
    <label>Total arrecadado (R$) <input id="brl" class="input" type="number" min="0" step="0.01"></label>
    <p class="note" id="usdPreview"></p>
    <label>Número de apoiadores <input id="sup" class="input" type="number" min="0"></label>

    <h3 style="margin-top:22px">Mural de apoiadores</h3>
    <div class="row">
      <input id="dName" class="input" placeholder="Nome">
      <input id="dVal" class="input" type="number" placeholder="US$ (opcional)">
    </div>
    <button id="add" class="btn btn-ghost btn-block">+ Adicionar ao mural</button>
    <ul id="list"></ul>

    <button id="save" class="btn btn-red btn-block">Salvar</button>
    <button id="logout" class="btn btn-ghost btn-block">Sair</button>
    <p id="saved" class="note"></p>
  </section>
</main>
<script src="js/config.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
